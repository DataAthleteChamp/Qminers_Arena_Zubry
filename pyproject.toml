[project]
name = "qminers-algo-arena"
version = "0.1.0"
description = "Qminers trading hackathon starter: write a strategy, backtest it, explore the run"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.8.0",
    # Available to strategies in the evaluation sandbox; pinned so every run sees the same versions.
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    # The backtest explorer.
    "dash>=4.3.0",
    "plotly>=6.8.0",
    "plotly-resampler>=0.11.0",
    # Imported by plotly-resampler, which does not declare it; pandas 3 stopped pulling it in.
    "pytz>=2026.3.post1",
]

[project.scripts]
exchange-simulator = "simulator.main:main"
backtest-explorer = "explorer.main:main"

[tool.uv]
package = true
# Path-based .pth editable install, so pyright and IDEs resolve `simulator` and `explorer`.
config-settings = { editable_mode = "compat" }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulator*", "explorer*"]

[tool.setuptools.package-data]
explorer = ["assets/*"]

# Team development tools; the organiser's runtime dependencies above are unchanged.
[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17,<1",
    "mypy>=1.20,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:dash"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["simulator", "explorer", "logs", "research/experiments", "submissions", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tools"]
follow_imports = "silent"
